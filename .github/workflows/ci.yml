name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten (ohne Torch, für die Tests nicht nötig)
        run: pip install numpy gymnasium jsonschema pytest
      - name: Basisdaten und Sim-Export aktuell
        run: |
          python tools/normalize.py
          git diff --exit-code data/base
          python tools/export_sim_data.py --check
      - run: python -m pytest tests -q

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Parität zur Python-Sim (f64, bit-genau)
        run: cargo test -p btd-core --features f64
