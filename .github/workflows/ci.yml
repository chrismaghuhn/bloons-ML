name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1 # wie engine/rust-toolchain.toml
        with:
          components: clippy
      - name: Abhängigkeiten
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.5.4 gymnasium stable-baselines3 sb3-contrib jsonschema pytest maturin  # numpy fix: Runden-Generator hängt am RNG-Stream
      - name: Rust-Bindings (f64, bit-genau zur Python-Sim) bauen und installieren
        working-directory: engine
        run: |
          cargo clippy -p btd-py --features f64 -- -D warnings
          maturin build --release -m crates/btd-py/Cargo.toml --features f64 -o ../dist
          pip install ../dist/*.whl
      - name: Basisdaten und Sim-Export aktuell
        run: |
          python tools/normalize.py
          git status --porcelain data/base | (! grep .)  # listet Änderungen, falls vorhanden
          python tools/export_sim_data.py --check  # Trace-Check läuft in pytest (tests/test_export.py)
      - run: python -m pytest tests -q

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1 # wie engine/rust-toolchain.toml
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features btd-core/f64 -- -D warnings
      - run: cargo test
      - name: Parität zur Python-Sim (f64, bit-genau)
        run: cargo test -p btd-core --features f64
